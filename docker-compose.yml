# Local development only. Railway provides its own Postgres service and secrets.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: vapor_username
      POSTGRES_PASSWORD: vapor_password
      POSTGRES_DB: vapor_database
    volumes:
      - nestic_pg17_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://vapor_username:vapor_password@db:5432/vapor_database?tlsmode=disable
      JWT_SECRET: local-compose-development-only-not-for-production
      AUTO_MIGRATE: "true"
      LOG_LEVEL: info
    ports:
      - "8080:8080"

volumes:
  nestic_pg17_data:
